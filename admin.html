<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="google-site-verification" content="3FAFYqU3ZU4JHxzioa0fd_Ck4XpSjVr6MCWsyNfqo9I"><meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="canonical" href="https://arkconvert.vercel.app/admin.html"><meta property="og:title" content="arkConvert — Owner Blog Admin"><meta property="og:description" content="Owner-only blog editor for arkConvert. Not linked from the site navigation."><meta property="og:type" content="website"><meta property="og:url" content="https://arkconvert.vercel.app/admin.html"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="arkConvert — Owner Blog Admin"><meta name="twitter:description" content="Owner-only blog editor for arkConvert. Not linked from the site navigation.">
<link rel="stylesheet" href="/assets/style.css"><script src="https://accounts.google.com/gsi/client" async defer></script></head><body><header class="site"><div class="wrap nav"><a class="logo" href="/">ark<span>Convert</span></a><nav class="main" aria-label="Main"><a href="/">Home</a><a href="/tools.html">Converter</a><a href="/blog/">Blog</a></nav></div></header><main class="wrap"><section><h1>Owner blog admin</h1><p class=\"sub\">Google sign-in. Owner only: arkmfk27@gmail.com.</p>
<div id="g_id_onload" data-client_id="REPLACE_WITH_YOUR_GOOGLE_CLIENT_ID" data-callback="arkSignIn"></div><div class="g_id_signin" data-type="standard"></div>
<div id="adminGate" class="status">Please sign in with Google to continue.</div>
<div id="editor" style="display:none"><label>Title</label><input id="pTitle"><label>Excerpt</label><textarea id="pExcerpt" rows="3"></textarea><label>Body (HTML paragraphs allowed)</label><textarea id="pBody" rows="10"></textarea>
<p><button class="btn" id="previewBtn" type="button">Preview</button> <button class="btn ghost" id="mdBtn" type="button">Download .md</button> <button class="btn ghost" id="snippetBtn" type="button">Download blog.js snippet</button></p><div id="preview" class="card"></div><pre id="snippet" style="white-space:pre-wrap"></pre></div>
<script>
function parseJwt(t){try{var p=t.split('.')[1];return JSON.parse(atob(p.replace(/-/g,'+').replace(/_/g,'/')))}catch(e){return {}}}
window.arkSignIn=function(r){var u=parseJwt(r.credential||"");var gate=document.getElementById('adminGate');
 if(u.email==='arkmfk27@gmail.com'){gate.textContent='Signed in as owner: '+u.email;gate.className='status ok';document.getElementById('editor').style.display='block'}
 else{gate.textContent='Owner only. Signed in as '+(u.email||'unknown')+' — this editor is for arkmfk27@gmail.com only.';gate.className='status err'}};
function slugify(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'new-post'}
function getPost(){return {slug:slugify(document.getElementById('pTitle').value),title:document.getElementById('pTitle').value,excerpt:document.getElementById('pExcerpt').value,date:new Date().toISOString().slice(0,10),body:document.getElementById('pBody').value}}
function dl(name,text){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.download=name;a.click()}
document.getElementById('previewBtn').onclick=function(){var p=getPost();document.getElementById('preview').innerHTML='<h2>'+p.title+'</h2><p>'+p.excerpt+'</p>'+p.body};
document.getElementById('mdBtn').onclick=function(){var p=getPost();dl(p.slug+'.md','---\ntitle: '+p.title+'\ndate: '+p.date+'\n---\n\n'+p.excerpt+'\n\n'+p.body)};
document.getElementById('snippetBtn').onclick=function(){var p=getPost();var s='// Add this object to window.ARK_BLOG_POSTS in assets/blog.js\n'+JSON.stringify(p,null,2)+',';document.getElementById('snippet').textContent=s;dl('blog-snippet.txt',s)};
</script></section></main><footer><div class="wrap"><p>arkConvert by Abdur Rahman Khan</p></div></footer><script src="/assets/app.js"></script></body></html>
